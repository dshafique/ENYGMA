{# Line icons, 20px, stroke currentColor. Inline so there is no second request
   and no flash of a missing glyph. #}
{% macro icon(name) -%}
<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' -%}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/>
{%- elif name == 'meetings' -%}
  <path d="M4 10v4M8 6.5v11M12 3.5v17M16 7.5v9M20 10.5v3"/>
{%- elif name == 'chat' -%}
  <path d="M20 12.5c0 3.9-3.6 7-8 7a9.5 9.5 0 0 1-2.6-.35L4.5 20.5l1.2-3.3A6.6 6.6 0 0 1 4 12.5c0-3.9 3.6-7 8-7s8 3.1 8 7Z"/>
{%- elif name == 'actions' -%}
  <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="m8 12.2 2.8 2.8L16.5 9.3"/>
{%- elif name == 'directory' -%}
  <circle cx="12" cy="8.5" r="3.75"/><path d="M4.5 20.5c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/>
{%- elif name == 'settings' -%}
  <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
{%- elif name == 'play' -%}
  <path d="M8 5.5 19 12 8 18.5Z" fill="currentColor" stroke-linejoin="round"/>
{%- elif name == 'pause' -%}
  <path d="M9 5.5v13M15 5.5v13"/>
{%- elif name == 'lock' -%}
  <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
{%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
{%- elif name == 'moon' -%}
  <path d="M20 13.5A8 8 0 0 1 10.5 4a8 8 0 1 0 9.5 9.5Z"/>
{%- elif name == 'back' -%}
  <path d="M15 5.5 8.5 12l6.5 6.5"/>
{%- elif name == 'send' -%}
  <path d="M20.5 3.5 3.5 10.2l7.1 2.7 2.7 7.1Z"/><path d="M20.5 3.5 10.6 12.9"/>
{%- elif name == 'plus' -%}
  <path d="M12 5.5v13M5.5 12h13"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>
{%- elif name == 'spark' -%}
  <path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18l-1.8-5.4-5.7-1.8L10.2 9Z"/>
{%- endif -%}
</svg>
{%- endmacro %}
